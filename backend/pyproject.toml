[project]
name = "solana-governance-agent"
version = "0.1.0"
description = "An Agentic RAG system for analyzing Solana DAO governance proposals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.0",
    "langgraph>=0.2.0",
    "solana>=0.35.0",
    "solders>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
